<header class="bg-fynzo-bg z-30 h-20">
    <div class="w-full px-6 flex justify-between items-center h-full">
        <!-- Mobile Sidebar Toggle -->
        <button id="sidebarToggle" class="lg:hidden text-gray-400 hover:text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        
        <!-- Search -->
        <div class="hidden md:flex items-center bg-gray-800/50 rounded-full px-4 py-2.5 border border-gray-700 focus-within:border-gray-500 transition-colors">
            <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" placeholder="Search..." class="bg-transparent border-none focus:outline-none text-sm text-white w-64 placeholder-gray-500">
            <div class="flex items-center justify-center w-5 h-5 rounded bg-gray-700 text-[10px] text-gray-400 ml-2 border border-gray-600">⌘K</div>
        </div>

        <div class="md:hidden flex-1"></div>

        <!-- Right Side -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-gray-800/40 py-1.5 px-2 rounded-full border border-gray-700">
                <div class="w-8 h-8 rounded-full bg-gray-700 overflow-hidden flex-shrink-0">
                    <img src="https://ui-avatars.com/api/?name={{ request.user.username|default:'Admin' }}&background=238636&color=fff" alt="avatar" class="w-full h-full object-cover">
                </div>
                <div class="pr-3 hidden sm:block">
                    <p class="text-xs font-semibold text-white leading-tight">{{ request.user.username|default:"Muhammad" }}</p>
                    <p class="text-[10px] font-bold text-blue-500 leading-tight tracking-wider uppercase mt-0.5">ADMIN</p>
                </div>
            </div>
        </div>
    </div>
</header>
