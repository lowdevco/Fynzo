<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2">
    {% if messages %}
        {% for message in messages %}
            <div class="toast-message flex items-center p-4 w-full max-w-xs text-white rounded-lg shadow-lg transform transition-all duration-300 translate-y-0 opacity-100 {% if message.tags == 'error' %}bg-red-600{% elif message.tags == 'success' %}bg-fynzo-highlight{% else %}bg-blue-600{% endif %}" role="alert">
                <div class="ml-3 text-sm font-normal mr-4">{{ message }}</div>
                <button type="button" class="ml-auto -mx-1.5 -my-1.5 text-white hover:text-gray-200 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 inline-flex h-8 w-8" aria-label="Close" onclick="this.parentElement.remove()">
                    <span class="sr-only">Close</span>
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        {% endfor %}
    {% endif %}
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toasts = document.querySelectorAll('.toast-message');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        });
    });

    window.showToast = function(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const bgColor = type === 'error' ? 'bg-red-600' : (type === 'success' ? 'bg-fynzo-highlight' : 'bg-blue-600');
        const toastHTML = `<div class="toast-message flex items-center p-4 w-full max-w-xs text-white rounded-lg shadow-lg transform transition-all duration-300 translate-y-0 opacity-100 ${bgColor}" role="alert"><div class="ml-3 text-sm font-normal mr-4">${message}</div><button type="button" class="ml-auto -mx-1.5 -my-1.5 text-white hover:text-gray-200 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 inline-flex h-8 w-8" aria-label="Close" onclick="this.parentElement.remove()"><span class="sr-only">Close</span><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></button></div>`;
        container.insertAdjacentHTML('beforeend', toastHTML);
        const newToast = container.lastElementChild;
        setTimeout(() => {
            newToast.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => newToast.remove(), 300);
        }, 5000);
    }
</script>
